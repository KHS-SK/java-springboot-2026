spring.application.name=studygroup

## 세션 만료 시간
# 1시간 유지
# server.servlet.session.timeout=3600

## Google OAuth2 설정
#Client-id와 client-secret키는 암호값이 github에 바로 노출
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email.profile

## JWT 설정
jwt.secret=${JWT_SECRET}
# 1시간 세션 (260428 오타 수정)
jwt.expiration=3600000

## 서버 이미지(파일) 저장경로
# 실제 서버 저장 경로 | 되도록 역슬래시 쓰지말 것
# 폴더, URL 마지막에 / 반드시 붙이세요!
file.upload-dir=D:/upload/studygroup/
file.access-url=/upload/studygroup/
# 서버에서 파일 업로드 제약사항 설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# 웹에디터에서 큰용량 이미지 업로드 설정
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

## 로그관련 설정
# 로그 색상
spring.output.ansi.enabled=always
# 로그레벨 설정
logging.level.root=info
# Mybatis로그
logging.level.com.pknu26.studygroup.mapper=debug
logging.level.org.mybatis=debug
logging.level.java.sql=debug

## Oracle DB 설정
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XE
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=studygroup
spring.datasource.password=${DB_PASSWORD}

## MyBatis 설정
# MyBatis 쿼리저장 위치
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.pknu26.studygroup.dto
mybatis.configuration.map-underscore-to-camel-case=true

## Thymeleaf 설정 - 개발때만 추가
spring.thymeleaf.cache=false
